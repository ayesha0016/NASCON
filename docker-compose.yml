services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nascon
      POSTGRES_PASSWORD: nascon
      POSTGRES_DB: nascon
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nascon"]
      interval: 2s
      retries: 30
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DAY1_SALT: ${DAY1_SALT}
      DATABASE_URL: postgresql://nascon:nascon@db:5432/nascon
    depends_on:
      db:
        condition: service_healthy
